name: Frontend CI/CD

on:
  push:
    branches: [main, dev, vansh]
    paths-ignore:
      - "backend/**"
      - "**.md"
  pull_request:
    branches: [main, dev, vansh]
    paths-ignore:
      - "backend/**"
      - "**.md"
  # Manual run — from the Actions tab, or:
  #   gh workflow run frontend.yml --ref dev
  #   gh workflow run frontend.yml --ref dev -f deploy=false   (build only)
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to sncf.elens.in after a successful build"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------- CI: every push and PR ----------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Validate production CMS address
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy)
        env:
          VITE_CMS_URL: ${{ vars.VITE_CMS_URL }}
        run: node scripts/check-cms-url.cjs

      - name: Build
        env:
          VITE_CMS_URL: ${{ vars.VITE_CMS_URL }}
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3

  # ---------- Deploy: main pushes and manual dispatch ----------
  deploy:
    permissions:
      id-token: write
      contents: read
    needs: build
    # Auto-deploys on pushes to main. A manual run deploys unless it was
    # dispatched with deploy=false, which builds and typechecks only.
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.deploy) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sncf.elens.in
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Validate deployment variables
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          test -n "$S3_BUCKET"
          test -n "$CLOUDFRONT_DISTRIBUTION_ID"

      # Keep older hashed chunks for visitors who still have the previous HTML.
      - name: Upload hashed build assets
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          aws s3 sync dist/assets/ "s3://$S3_BUCKET/assets/" \
            --cache-control "public, max-age=31536000, immutable"

      # Public photos, GLBs and videos retain their filenames when replaced.
      - name: Upload replaceable media
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          aws s3 cp dist/ "s3://$S3_BUCKET/" --recursive \
            --exclude "assets/*" --exclude "index.html" \
            --cache-control "public, max-age=0, must-revalidate"

      # index.html must always revalidate so new asset hashes are picked up.
      - name: Upload index.html
        run: |
          aws s3 cp dist/index.html "s3://${{ vars.S3_BUCKET }}/index.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
