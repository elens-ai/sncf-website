services:
  web-dev:
    build:
      context: .
      target: dev
    image: sncf-website:dev
    container_name: sncf-website-dev
    profiles: ["dev"]
    ports:
      - "${DEV_PORT:-3000}:3000"
    volumes:
      # Live-reload source from the host; keep container-installed node_modules.
      - ./src:/app/src
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
      - ./tsconfig.json:/app/tsconfig.json
      - ./assets:/app/assets
      - ./public:/app/public
      - node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_CMS_URL=${VITE_CMS_URL:-http://127.0.0.1:3001}
    restart: unless-stopped

  web:
    build:
      context: .
      target: prod
      args:
        VITE_CMS_URL: ${VITE_CMS_URL:-}
    image: sncf-website:prod
    container_name: sncf-website
    profiles: ["prod"]
    ports:
      - "${PROD_PORT:-8080}:80"
    restart: unless-stopped

  # ── THE CMS ────────────────────────────────────────────────────────────────
  # Published CMS content is fetched at runtime; cached/bundled data keeps the
  # frontend available if the CMS is down. Production requires a public HTTPS
  # VITE_CMS_URL at frontend build time and matching CMS_ALLOWED_ORIGINS.
  db:
    image: postgres:17-alpine
    container_name: sncf-cms-db
    profiles: ["cms", "dev"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sncf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sncf}
      POSTGRES_DB: ${POSTGRES_DB:-sncf_cms}
    ports:
      # 5433 on the host: 5432 is usually already taken by a local Postgres,
      # and a port clash here fails in a way that looks like a CMS bug.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # `cms-migrate` waits on this. A container that is merely *up* has not
      # necessarily finished initdb, and a migration fired at that moment dies
      # against a socket that is not listening yet.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sncf} -d ${POSTGRES_DB:-sncf_cms}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Applies pending migrations, then exits. A ONE-SHOT service, not a daemon.
  #
  # It exists as its own container because the schema cannot be migrated from
  # the `cms` image: Next's standalone output prunes payload's CLI, tsx and
  # drizzle-kit out of node_modules (backend/Dockerfile explains the detail).
  # This runs the `cli` stage, which still has the full install.
  #
  # Separating it also buys the property you want on a deploy: the schema
  # change either succeeds or the new admin never starts. `cms` below waits on
  # this exiting 0, so a failed migration leaves the OLD container serving
  # rather than a new one against a half-built schema.
  cms-migrate:
    build:
      context: ./backend
      target: cli
    image: sncf-cms:cli
    container_name: sncf-cms-migrate
    profiles: ["cms"]
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URI: postgres://${POSTGRES_USER:-sncf}:${POSTGRES_PASSWORD:-sncf}@db:5432/${POSTGRES_DB:-sncf_cms}
      NODE_ENV: production
    # Never restart. A migration that failed must be read and fixed, not
    # retried in a loop that fills the log with the same error.
    restart: "no"

  # Optional published JSON backup (the live site does not need a rebuild).
  # docker compose --profile export run --rm cms-export
  cms-export:
    build:
      context: ./backend
      target: cli
    image: sncf-cms:cli
    profiles: ["export"]
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URI: postgres://${POSTGRES_USER:-sncf}:${POSTGRES_PASSWORD:-sncf}@db:5432/${POSTGRES_DB:-sncf_cms}
      NODE_ENV: production
      # Where the script writes. Inside the container; the mount below maps it
      # back to the repo's src/data on the host.
      EXPORT_OUT_FILE: /out/cms-content.json
    volumes:
      - ./public:/out
    # Writes as the invoking user, not root. On Linux a root-owned container
    # writing through a bind mount leaves root-owned .ts files in the working
    # tree, and the next `git checkout` of those paths fails with EACCES.
    # Run it as:  EXPORT_UID=$(id -u) EXPORT_GID=$(id -g) docker compose ...
    # (macOS does not need this — Docker Desktop remaps ownership already.)
    user: "${EXPORT_UID:-1000}:${EXPORT_GID:-1000}"
    command: ["./node_modules/.bin/payload", "run", "scripts/export-content.ts"]
    restart: "no"

  cms:
    build:
      context: ./backend
      # `runner`, not `prod` — the Dockerfile names its stages for what they
      # do, and it builds a second runnable stage (`migrator`) above.
      target: runner
    image: sncf-cms:prod
    container_name: sncf-cms
    profiles: ["cms"]
    depends_on:
      db:
        condition: service_healthy
      cms-migrate:
        # Not service_started: the admin must not boot until the schema it was
        # built against is actually in the database.
        condition: service_completed_successfully
    # The app's own settings come from backend/.env — one file, the same one
    # `npm run dev` reads, so the container and a local run cannot drift.
    env_file:
      - ./backend/.env
    environment:
      # OVERRIDES the DATABASE_URI in that file on purpose. backend/.env points
      # at localhost:5433 because that is where the database is reachable from
      # the host; inside the compose network it is db:5432. Getting this wrong
      # produces a connection refused that reads like a broken CMS.
      DATABASE_URI: postgres://${POSTGRES_USER:-sncf}:${POSTGRES_PASSWORD:-sncf}@db:5432/${POSTGRES_DB:-sncf_cms}
      NODE_ENV: production
    ports:
      - "127.0.0.1:${CMS_PORT:-3001}:3001"
    volumes:
      # Uploads live on a named volume, not in the image: rebuilding the CMS
      # must never destroy the media library. The image creates /app/media
      # owned by the unprivileged `nextjs` user, and a named volume inherits
      # that ownership on first mount — a bind mount would not, and uploads
      # would fail with EACCES.
      - cms_media:/app/media
    # The healthcheck is declared in the image (curl on Payload's /api/access).
    restart: unless-stopped

volumes:
  node_modules:
  db_data:
  cms_media:
